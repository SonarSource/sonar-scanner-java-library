name: Build
on:
  push:
    branches:
      - master
      - branch-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    name: Build
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          tool_versions: |
            java temurin-21

      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: '**/target/surefire-reports/**/*.xml'
          if-no-files-found: ignore

  qa:
    name: QA - SQ ${{ matrix.SQ_VERSION }}
    needs: build
    runs-on: github-ubuntu-latest-s
    env:
      JAVA_VERSION: LATEST_RELEASE
    strategy:
      fail-fast: false
      matrix:
        include:
          - SQ_VERSION: LATEST_RELEASE
            JAVA_VERSION: 21
          - SQ_VERSION: LATEST_RELEASE[2026.1]
            JAVA_VERSION: 21
          - SQ_VERSION: LATEST_RELEASE[2025.1]
            JAVA_VERSION: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          tool_versions: |
            java temurin-${{ matrix.JAVA_VERSION }}

      - name: Getting Vault Secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/SonarSource-sonar-scanner-java-library-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;
            development/github/token/licenses-ro token | GITHUB_TOKEN

      - name: Configure Maven
        uses: SonarSource/ci-github-actions/config-maven@v2
        with:
          artifactory-reader-role: private-reader

      - name: Run ITs
        run: |
          cd its
          mvn -B -e verify -Prun-its -Dsonar.runtimeVersion=${{ matrix.SQ_VERSION }}

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-logs-${{ github.job }}-${{ strategy.job-index }}
          path: "**/target/**/logs/**.log"
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ github.job }}-${{ strategy.job-index }}
          path: "**/target/surefire-reports/**.xml"
          if-no-files-found: ignore

  promote:
    name: Promote
    needs: qa
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: false
          version: 2026.10.14
      - uses: SonarSource/ci-github-actions/get-build-number@v2
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true
